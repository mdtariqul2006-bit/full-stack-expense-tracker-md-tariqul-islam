<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Subtle glow effect for the highlighted bar -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card (Tailwind slate-900) -->
  <rect width="800" height="500" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Header Text (Tailwind slate-50 and slate-400) -->
  <text x="40" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#f8fafc">All Transactions</text>
  <text x="40" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">2nd Jan to 21st Dec</text>

  <!-- View More Button -->
  <rect x="660" y="40" width="100" height="36" rx="8" fill="#14b8a6" fill-opacity="0.1" stroke="#14b8a6" stroke-opacity="0.3"/>
  <text x="710" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#2dd4bf" text-anchor="middle">View More</text>

  <!-- Y-Axis Labels -->
  <text x="40" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">400</text>
  <text x="40" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">230</text>
  <text x="40" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">160</text>
  <text x="40" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">0</text>

  <!-- Horizontal Grid Lines (Tailwind slate-800) -->
  <line x1="80" y1="156" x2="760" y2="156" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="80" y1="236" x2="760" y2="236" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="80" y1="316" x2="760" y2="316" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="80" y1="396" x2="760" y2="396" stroke="#334155" stroke-width="1"/>

  <!-- Bar Groups -->
  
  <!-- Jan -->
  <rect x="120" y="280" width="36" height="116" rx="6" fill="#0d9488"/>
  <rect x="120" y="220" width="36" height="50" rx="6" fill="#14b8a6" fill-opacity="0.3"/>
  <text x="138" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Jan</text>

  <!-- Feb -->
  <rect x="210" y="200" width="36" height="196" rx="6" fill="#0d9488"/>
  <rect x="210" y="150" width="36" height="40" rx="6" fill="#14b8a6" fill-opacity="0.3"/>
  <text x="228" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Feb</text>

  <!-- Mar -->
  <rect x="300" y="220" width="36" height="176" rx="6" fill="#0d9488"/>
  <rect x="300" y="130" width="36" height="80" rx="6" fill="#14b8a6" fill-opacity="0.3"/>
  <text x="318" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Mar</text>

  <!-- Apr (Highlighted / Active) -->
  <rect x="390" y="190" width="36" height="206" rx="6" fill="#2dd4bf" filter="url(#glow)"/>
  <rect x="390" y="120" width="36" height="60" rx="6" fill="#2dd4bf" fill-opacity="0.4"/>
  <text x="408" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">Apr</text>

  <!-- Apr Tooltip -->
  <rect x="440" y="90" width="140" height="76" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1"/>
  <text x="455" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">April</text>
  <text x="455" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Income: <tspan fill="#2dd4bf" font-weight="500">$5,400</tspan></text>
  <text x="455" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Expense: <tspan fill="#0d9488" font-weight="500">$2,100</tspan></text>

  <!-- May -->
  <rect x="480" y="300" width="36" height="96" rx="6" fill="#0d9488"/>
  <rect x="480" y="270" width="36" height="20" rx="6" fill="#14b8a6" fill-opacity="0.3"/>
  <text x="498" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">May</text>

  <!-- Jun -->
  <rect x="570" y="200" width="36" height="196" rx="6" fill="#0d9488"/>
  <rect x="570" y="110" width="36" height="80" rx="6" fill="#14b8a6" fill-opacity="0.3"/>
  <text x="588" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Jun</text>

  <!-- Jul -->
  <rect x="660" y="200" width="36" height="196" rx="6" fill="#0d9488"/>
  <rect x="660" y="130" width="36" height="60" rx="6" fill="#14b8a6" fill-opacity="0.3"/>
  <text x="678" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Jul</text>

</svg>
